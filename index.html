<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3a55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>紬 保全パートナー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1d2636;color:#eef2f8;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;overscroll-behavior-y:none}
.app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{flex:none;padding:10px 14px;display:flex;align-items:center;gap:10px;background:#2b3a55}
header h1{margin:0;font-size:20px;flex:1}
header .ver{font-size:12px;color:#a9b6cc}
header button{min-height:40px;padding:0 12px;border-radius:12px;border:2px solid #8fa3c4;background:transparent;color:#eef2f8;font-size:15px;font-weight:800}
main{flex:1;min-height:0;overflow:auto;padding:14px}
.say{background:#2b3a55;border-radius:16px;padding:14px;font-size:20px;font-weight:800;line-height:1.5;margin-bottom:12px;border-left:6px solid #ffb86b}
.say small{display:block;font-size:13px;font-weight:700;color:#a9b6cc;margin-bottom:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:64px;margin:8px 0;border-radius:16px;border:0;font-size:21px;font-weight:900;color:#fff;background:#3b6fd4}
.btn.ok{background:#2f8f5b}.btn.warn{background:#d99a1f;color:#1d2636}.btn.ng{background:#c9453b}.btn.gray{background:#46556f}.btn.line{background:transparent;border:3px solid #8fa3c4;color:#eef2f8}
.row{display:flex;gap:8px}.row .btn{margin:6px 0}
.prog{font-size:15px;color:#a9b6cc;font-weight:800;margin-bottom:6px}
textarea{width:100%;min-height:110px;border-radius:12px;border:2px solid #46556f;background:#141b28;color:#eef2f8;font-size:18px;padding:10px;font-family:inherit}
.card{background:#2b3a55;border-radius:14px;padding:12px;margin:8px 0}
.card b{font-size:17px}.card .m{font-size:14px;color:#a9b6cc;margin-top:4px;line-height:1.5;white-space:pre-wrap}
.tag{display:inline-block;font-size:12px;font-weight:900;border-radius:8px;padding:1px 8px;margin-right:6px;background:#46556f}
.tag.ng{background:#c9453b}.tag.warn{background:#d99a1f;color:#1d2636}.tag.ok{background:#2f8f5b}
.mic{font-size:15px;color:#ffb86b;font-weight:800;min-height:22px;margin:4px 0}
label.sw{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;min-height:48px}
label.sw input{width:26px;height:26px}
.rep h3{margin:10px 0 4px;font-size:16px;color:#ffb86b}.rep ul{margin:4px 0 6px;padding-left:22px;font-size:17px;line-height:1.55}.rep .urgent{background:#5a2420;border-left:6px solid #c9453b}.rep .foot{font-size:12px;color:#a9b6cc;line-height:1.5;margin-top:8px}.fb{display:flex;gap:8px}.fb .btn{min-height:52px;font-size:17px}
.note{font-size:13px;color:#a9b6cc;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<div class="app">
 <header><h1 id="ttl">紬</h1><span class="ver">Ver 1.3</span><button id="back" type="button" style="display:none">← 戻る</button></header>
 <main id="main"></main>
</div>
<script src="kb.js"></script>
<script>
(function(){
'use strict';
var KEY={items:'tsu_items',log:'tsu_log',cfg:'tsu_cfg',draft:'tsu_draft'};
var DEFAULT_ITEMS=['外観(漏れ・破損・ゆるみ)','音(いつもと違う音)','振動','熱・におい','計器の値','まわりの清掃・整理'];
/* 設備の種類ごとの「見るべき要所」。稼働中点検で、外から安全に見られる所だけ。
   [要所, 見るところ(短く)]。触る・開ける・止めるは、社内の手順と上の人の指示で。 */
var TYPES=[
 {id:'pump',label:'ポンプ',items:[
  ['軸封部(シール・グランド)','漏れの量を見る。シールは漏れないのが基本。グランドは少しの滴下が正常なものもあるので、いつもの量と比べる'],
  ['軸受(ベアリング)まわり','温度(手をかざす・温度計)と、ゴロゴロ音。前回との差を見る'],
  ['吐出・吸込の圧力計','いつもの値との差と、針のふれを見る'],
  ['吸込側の音','ガラガラ・バチバチという音がないか(泡がつぶれる音のことがある)'],
  ['カップリング・ベース','振動、ボルトのゆるみ、カバーまわりの粉(芯ずれのあと)を見る'],
  ['まわりの配管・フランジ','にじみ、支えのゆるみを見る']]},
 {id:'motor',label:'モーター',items:[
  ['本体の温度','手をかざすか温度計で。前回や、となりの同じ型との差を見る。焦げたにおいがないか'],
  ['音','うなり、ゴロゴロ、キーンという音がないか。いつもと比べる'],
  ['振動','足元とベースのボルトを見る'],
  ['冷却ファン・吸気口','ほこりの詰まり、カバーの破れを見る'],
  ['電流値(盤の電流計)','いつもの値との差と、ふらつきを見る'],
  ['端子箱・配線(外から)','変色、ケーブルの傷を見る。開けない']]},
 {id:'fan',label:'ファン・送風機',items:[
  ['羽根まわりの音と振動','汚れがつくと揺れが出やすい。いつもと比べる'],
  ['軸受','温度と音を見る'],
  ['ベルト(ある場合)','張り、ひび、キュルキュル音、ゴムの粉を見る'],
  ['吸込口・フィルター','詰まりを見る。差圧計があれば値を見る'],
  ['ダンパー','開き具合が、いつもの位置か'],
  ['ベース・防振ゴム','ゆるみと、ゴムのひび・つぶれを見る']]},
 {id:'comp',label:'コンプレッサー',items:[
  ['吐出の圧力・温度','いつもの値との差を見る'],
  ['ドレン','出ているか、量、油が混じっていないか'],
  ['油面(油を使う型)','油面計の範囲内か、色のにごり'],
  ['音・振動','いつもと違う打つ音がないか'],
  ['エア漏れ','配管の継ぎ目でシューという音がないか'],
  ['吸込フィルター','汚れと詰まりを見る']]},
 {id:'gear',label:'減速機・ギア',items:[
  ['油面と油の色','油面計の範囲内か。にごり、金属の粉'],
  ['ケースの温度','いつもより熱くないか'],
  ['音','歯車のうなり、カンカンという打つ音'],
  ['油漏れ','オイルシールと、ケースの合わせ目'],
  ['取付ボルト・振動','ゆるみと揺れを見る']]},
 {id:'conv',label:'コンベヤ',items:[
  ['ベルト・チェーンの張りと片寄り','片側に寄って走っていないか'],
  ['ローラー・スプロケット','回っていないローラー、すり減りを見る'],
  ['駆動部の音と温度','モーター・減速機・軸受まわり'],
  ['非常停止・安全カバー','外れていないか、見るだけ'],
  ['こぼれ・たまり','落ちた物がたまっていないか'],
  ['給油(チェーン)','油切れで乾いていないか']]},
 {id:'pipe',label:'配管・バルブ',items:[
  ['継手・フランジ','にじみと漏れ'],
  ['保温材','ぬれ、破れ(中のさびの兆し)'],
  ['バルブ','開閉の表示がいつも通りか。グランドからの漏れ'],
  ['支え金具','ゆるみと揺れ'],
  ['さび・腐食','塗装のふくれ、はがれ'],
  ['ストレーナー前後の圧力','差が大きくなっていないか(詰まりの兆し)']]},
 {id:'panel',label:'制御盤・電気',items:[
  ['表示灯・警報','いつもと違う表示がないか'],
  ['におい・音','焦げたにおい、ジーという音'],
  ['盤の温度・換気','換気ファンが回っているか、フィルターの詰まり'],
  ['計器の値','電流・電圧が、いつもの値か'],
  ['扉・パッキン','閉まっているか。ほこりや水の入り口がないか。盤は開けない']]}
];
function typeById(id){return TYPES.filter(function(t){return t.id===id})[0]}
var synth=window.speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var M=document.getElementById('main'),T=document.getElementById('ttl'),B=document.getElementById('back');
var S={token:0,rec:null,voice:null,inspect:null};

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cfg(){return Object.assign({voice:true,listen:false,ai:false,useLog:false,key:'',model:'gemini-flash-latest',ng:''},load(KEY.cfg,{}))}
function items(){var a=load(KEY.items,null);return a&&a.length?a:DEFAULT_ITEMS}
function log(){return load(KEY.log,[])}
function addLog(e){var l=log();l.unshift(e);save(KEY.log,l.slice(0,500))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function now(){var d=new Date(),p=function(n){return('0'+n).slice(-2)};return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}

function stopAll(){S.token++;try{synth&&synth.cancel()}catch(e){}try{S.rec&&S.rec.abort()}catch(e){}S.rec=null}
function speak(t){
  return new Promise(function(res){
    if(!synth||!cfg().voice)return res();
    var u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.0;
    var vs=synth.getVoices()||[];var v=vs.filter(function(x){return /^ja/i.test(x.lang)})[0];if(v)u.voice=v;
    var d=false;function f(){if(!d){d=true;res()}}u.onend=f;u.onerror=f;setTimeout(f,15000);
    synth.cancel();synth.speak(u);
  });
}
function listen(onText,onState){
  if(!SR){onState&&onState('この端末では声の聞き取りが使えません。ボタンで答えてください');return}
  try{S.rec&&S.rec.abort()}catch(e){}
  var r=new SR();r.lang='ja-JP';r.interimResults=false;S.rec=r;var got=false;
  r.onresult=function(e){got=true;onText(e.results[0][0].transcript)};
  r.onerror=function(){onState&&onState('聞き取れませんでした')};
  r.onend=function(){if(!got)onState&&onState('聞き取れませんでした')};
  onState&&onState('🎤 聞いています…');
  try{r.start()}catch(e){}
}
function judge(t){
  t=t.replace(/\s/g,'');
  if(/異常|おかしい|だめ|ダメ|壊れ|漏れ|止ま/.test(t))return'ng';
  if(/気になる|ちょっと|少し|微妙|いつもと違/.test(t))return'warn';
  if(/正常|大丈夫|問題ない|問題なし|OK|オーケー|いつも通り|異常なし/.test(t))return'ok';
  if(/次|スキップ|飛ばし/.test(t))return'skip';
  return'';
}

function view(title,showBack,html){T.textContent=title;B.style.display=showBack?'':'none';M.innerHTML=html;M.scrollTop=0}
function on(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn}

/* ---- ホーム ---- */
function home(){
  stopAll();
  var l=log().filter(function(x){return x.type==='inspect'});
  var last=l[0]?('前回の点検:'+l[0].at+'(異常'+l[0].ng+'・気になる'+l[0].warn+')'):'まだ点検の記録はありません';
  view('紬',false,
   '<div class="say"><small>紬</small>おつかれさまです。気になることがあれば、まず話しかけてください。一緒に考えます。<br><span style="font-size:15px;font-weight:700;color:#a9b6cc">'+esc(last)+'</span></div>'+
   '<button class="btn" id="bChat" style="background:#6b4fc9;min-height:130px;font-size:28px">🗨 紬に話しかける<br><small style="font-size:16px;font-weight:700">状況を話すだけ。正常か異常かも、一緒に考えます</small></button>'+
   '<div class="row"><button class="btn gray" id="bStart">▶ 点検をはじめる</button><button class="btn gray" id="bLog">📖 見聞録</button></div>'+
   '<button class="btn line" id="bSet" style="min-height:48px;font-size:16px">⚙ 設定</button>'+
   '<div class="note">記録はこのスマホの中だけに保存されます。外部には送りません。</div>');
  on('bStart',startInspect);
  on('bChat',chat);
  on('bLog',showLog);on('bSet',settings);
}
B.onclick=home;

/* ---- 点検 ---- */
function startInspect(){
  stopAll();
  S.inspect={at:now(),equip:'',type:'',list:null,results:[],i:0,learn:''};
  view('点検の前に',true,
   '<div class="say"><small>紬</small>どの種類の設備ですか?押すと、見るべき要所の順に点検が始まります。</div>'+
   '<div class="row" style="flex-wrap:wrap">'+TYPES.map(function(t){return '<button class="btn" data-ty="'+t.id+'" style="flex:1 1 45%;min-height:60px;font-size:19px">'+esc(t.label)+'</button>'}).join('')+'</div>'+
   '<button class="btn gray" data-ty="" style="min-height:56px;font-size:18px">いつもの項目(設定で決めた項目)</button>'+
   '<div class="mic" id="mic"></div>'+
   '<button class="btn line" id="tyMic">🎤 声で種類を言う(例:「ポンプ」)</button>'+
   '<details style="margin-top:6px"><summary style="font-size:16px">設備の名前をメモする(なくてもよい)</summary>'+
   '<textarea id="eq" placeholder="例:〇号機(会社名・型式は書かない)" style="min-height:60px;margin-top:6px"></textarea>'+
   '<button class="btn gray" id="eqMic">🎤 声で入れる</button></details>');
  speak('どの種類の設備ですか?');
  function go(id){var t=typeById(id);stopAll();
    S.inspect.equip=(document.getElementById('eq').value||'').trim();S.inspect.type=t?t.label:'';
    S.inspect.list=t?t.items.map(function(x){return {n:x[0],h:x[1]}}):items().map(function(x){return {n:x,h:''}});
    S.inspect.i=0;ask()}
  Array.prototype.forEach.call(M.querySelectorAll('[data-ty]'),function(b){b.onclick=function(){go(b.getAttribute('data-ty'))}});
  on('tyMic',function(){listen(function(t){t=t.replace(/\s/g,'');
      var hit=TYPES.filter(function(x){return x.label.split('・').some(function(w){return t.indexOf(w)>=0})})[0];
      if(hit)go(hit.id);else document.getElementById('mic').textContent='「'+t+'」…種類が分かりませんでした。ボタンで選んでください'},
    function(m){var e=document.getElementById('mic');if(e)e.textContent=m})});
  on('eqMic',function(){listen(function(t){document.getElementById('eq').value=t;document.getElementById('mic').textContent=''},function(m){document.getElementById('mic').textContent=m})});
}
function ask(){
  var I=S.inspect,list=I.list||items().map(function(x){return {n:x,h:''}});
  if(I.i>=list.length)return learn();
  var my=++S.token,cur=list[I.i],it=cur.n;
  view('点検 '+(I.i+1)+'/'+list.length,true,
   '<div class="prog">'+esc((I.type?I.type+' ':'')+(I.equip||''))+'</div>'+
   '<div class="say"><small>紬</small>'+esc(it)+'は、どうですか?'+(cur.h?'<span style="display:block;font-size:17px;font-weight:700;color:#cfe0ff;margin-top:6px">見るところ:'+esc(cur.h)+'</span>':'')+'</div>'+
   '<div class="row"><button class="btn ok" id="rOk">正常</button><button class="btn warn" id="rWarn">気になる</button></div>'+
   '<div class="row"><button class="btn ng" id="rNg">異常</button><button class="btn gray" id="rSkip">とばす</button></div>'+
   '<div class="mic" id="mic"></div>'+
   '<button class="btn line" id="rMic">🎤 声で答える(「正常」「気になる」「異常」)</button>');
  function go(r){stopAll();if(r==='skip'){I.i++;return ask()}
    if(r==='ok'){I.results.push({item:it,r:'ok',memo:''});I.i++;return ask()}
    detail(it,r)}
  on('rOk',function(){go('ok')});on('rWarn',function(){go('warn')});on('rNg',function(){go('ng')});on('rSkip',function(){go('skip')});
  function voiceAns(){listen(function(t){var r=judge(t);if(r)go(r);else{document.getElementById('mic').textContent='「'+t+'」…もう一度お願いします';setTimeout(voiceAns,600)}},function(m){var e=document.getElementById('mic');if(e)e.textContent=m})}
  on('rMic',voiceAns);
  speak(it+'。'+(cur.h?cur.h+'。':'')+'どうですか?').then(function(){if(my===S.token&&cfg().listen)voiceAns()});
}
function detail(it,r){
  var I=S.inspect;
  view(r==='ng'?'異常':'気になる',true,
   '<div class="say"><small>紬</small>'+esc(it)+':'+(r==='ng'?'異常':'気になる')+'ですね。どんな様子か、教えてください。</div>'+
   '<textarea id="mm" placeholder="様子・場所・いつから(声でも入力できます)"></textarea><div class="mic" id="mic"></div>'+
   '<button class="btn gray" id="mMic">🎤 声でメモ</button><button class="btn" id="mGo">記録して、紬の返事を聞く</button>');
  speak('どんな様子か、教えてください。');
  on('mMic',function(){listen(function(t){var e=document.getElementById('mm');e.value=(e.value?e.value+' ':'')+t;document.getElementById('mic').textContent=''},function(m){document.getElementById('mic').textContent=m})});
  on('mGo',function(){
    stopAll();var memoText=document.getElementById('mm').value.trim();
    var rec={item:it,r:r,memo:memoText};I.results.push(rec);
    if(!memoText){I.i++;return ask()}
    var ent={id:'i'+Date.now(),at:now(),equip:I.equip};
    replyScreen(it+'('+(r==='ng'?'異常':'気になる')+')',(it+':'+memoText),ent.at,ent,'点検のつづきへ ▶',function(){rec.fbNote=ent.fbNote||'';rec.feedback=ent.feedback||0;I.i++;ask()});
  });
}
function learn(){
  var I=S.inspect;
  view('今日の学び',true,
   '<div class="say"><small>紬</small>おつかれさまでした。今日、気づいたことや、自分でこう判断した、ということがあれば教えてください。(なければ空のままで大丈夫です)</div>'+
   '<textarea id="ln" placeholder="例:この音は負荷が上がったときに出る。前より少し高い。"></textarea><div class="mic" id="mic"></div>'+
   '<button class="btn gray" id="lMic">🎤 声でメモ</button><button class="btn ok" id="lGo">点検を終えて保存する</button>');
  speak('おつかれさまでした。今日、気づいたことや、自分でこう判断したことがあれば、教えてください。');
  on('lMic',function(){listen(function(t){var e=document.getElementById('ln');e.value=(e.value?e.value+' ':'')+t;document.getElementById('mic').textContent=''},function(m){document.getElementById('mic').textContent=m})});
  on('lGo',function(){
    stopAll();I.learn=document.getElementById('ln').value.trim();
    var ng=I.results.filter(function(x){return x.r==='ng'}).length,warn=I.results.filter(function(x){return x.r==='warn'}).length;
    addLog({type:'inspect',at:I.at,equip:(I.type?I.type+(I.equip?' ':''):'')+I.equip,results:I.results,ng:ng,warn:warn,learn:I.learn});
    view('保存しました',false,'<div class="say"><small>紬</small>保存しました。異常 '+ng+' 件、気になる '+warn+' 件でした。'+(ng?'異常はすぐに上の人へ連絡してくださいね。':'おつかれさまでした。')+'</div><button class="btn" id="hm">ホームへ</button>');
    on('hm',home);speak('保存しました。異常は'+ng+'件、気になるは'+warn+'件でした。');
  });
}

/* ---- 紬の返答(ルールによる一般的な目安。AIなしで動く) ---- */
var RULES=[
 {k:/焦げ|煙|発煙|火花|スパーク|発火|燃|感電|ビリビリ|爆|ガス|異臭|強いにおい/,urgent:true,name:'安全に関わる',
  now:['安全な距離をとり、無理に近づかない','設備の停止・遮断は、社内の手順と上の人の指示に従う(自己判断で触らない)','すぐ上の人・担当者へ連絡する','必要なら、社内の緊急連絡のルールに従う'],
  ask:['いま、周りに人はいますか?','煙・火・においは続いていますか?']},
 {k:/漏れ|漏洩|にじ|垂れ|オイル|油|水が|エア漏れ/,name:'漏れ',
  now:['触らず、場所と量を目で確認する','足元の滑り・感電・火気に注意する','立入制限や受けの処置は、社内の手順に従う'],
  ask:['何が漏れていますか(油・水・エア・薬品など)?','量は増えていますか?','設備は動いていますか?']},

function replyFor(text){
  var hit=RULES.filter(function(r){return r.k.test(text)})[0];
  if(!hit)hit={name:'ようす',now:['安全を確かめてから、様子を写真やメモで残す','いつもと違う点を、前回の記録と比べる','迷うときは、一人で判断せず、上の人に相談する'],ask:['いつから気づきましたか?','前回の点検と比べて、何が違いますか?','設備は止まっていますか?']};
  return hit;
}
function grams(t){t=String(t||'').replace(/[\s。、,.:;()（）「」【】\n]/g,'');var g={};for(var i=0;i<t.length-1;i++)g[t.substr(i,2)]=1;return g}
function similar(text,selfId){
  var a=grams(text),ka=Object.keys(a);if(!ka.length)return[];
  var pool=[];
  log().forEach(function(x){
    if(x.type==='inspect'){(x.results||[]).forEach(function(rs){if(rs.memo)pool.push({id:x.id,at:x.at,equip:x.equip,text:rs.item+':'+rs.memo,fb:rs.feedback,note:rs.fbNote||'',learn:x.learn||''})})}
    else if(x.text)pool.push({id:x.id,at:x.at,text:x.text,fb:x.feedback,note:x.fbNote||''});
  });
  return pool.filter(function(x){return x.id!==selfId}).map(function(x){
    var b=grams(x.text),kb=Object.keys(b),n=0;ka.forEach(function(k){if(b[k])n++});
    x.score=n/Math.max(1,(ka.length+kb.length-n));return x;
  }).filter(function(x){return x.score>=0.12}).sort(function(a,b){return b.score-a.score}).slice(0,2);
}
function similarHtml(list){
  if(!list.length)return '';

  fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(c.model)+':generateContent',{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':c.key},

function sanitize(t,strict){
  var c=cfg(),out=String(t),hits=[];
  String(c.ng||'').split(/\n/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(w){
    var p=w.split(/[=＝]/),from=p[0].trim(),to=(p[1]||'').trim();
    if(from&&out.indexOf(from)>=0){hits.push(to?from+'→'+to:from);out=out.split(from).join(to||'(伏せ字)')}});
  out=out.replace(/[^\s、。,.「」()（）:：・→]{1,10}(ライン|号機|工場|棟|課|部門|設備室)/g,function(m){var p=/^[のがはをにでと]/.test(m)?m.charAt(0):'';hits.push(p?m.slice(1):m);return p+'(設備・場所)'});
  if(strict)out=out.replace(/[A-Za-zＡ-Ｚａ-ｚ]+[-‐ー－]?[0-9０-９][A-Za-z0-9０-９\-‐－_\/\.]*/g,function(m){hits.push(m);return '(型式・番号)'});
  if(strict)out=out.replace(/[0-9０-９][0-9０-９,\.]*\s*(MPa|kPa|Pa|℃|度|A|V|kW|W|rpm|Hz|mm|cm|m|kg|t|L|%|％)/g,function(m){hits.push(m);return '(数値)'});
  return {text:out,hits:hits};
}

  function paint(){var r=sanitize(q,strict);ta.value=r.text;
    gh.innerHTML=(r.hits.length?'伏せ字・言い換えた言葉:<b>'+r.hits.map(esc).join('、')+'</b>':'伏せ字にした言葉はありません。');
    lv[0].className='btn '+(strict?'gray':'ok');lv[1].className='btn '+(strict?'ok':'gray')}
  lv[0].onclick=function(){strict=false;paint()};lv[1].onclick=function(){strict=true;paint()};
  paint();
  box.querySelector('#gs').onclick=function(){var t=ta.value.trim();box.remove();if(t)onSend(t)};
  box.querySelector('#gn').onclick=function(){box.remove();onSkip()};
}
function classify(q){
  var h=replyFor(q);
  if(h.urgent)return '⚠ 異常のおそれ(安全を最優先に)';
  if(/異音|漏れ|煙|焦げ|臭い|におい|発熱|熱い|振動|止ま|停止|エラー|警報|アラーム|おかしい|変な|いつもと違/.test(q))return '気になる状態';
  if(/正常|問題な|異常な|変わりな/.test(q))return '正常のようです';
  if(/[?？]|どう|なぜ|なに|何|どれ|いつ|教えて/.test(q))return '質問';
  return '相談・メモ';
}
function chat(){
  stopAll();S.chat=S.chat||[];var c=cfg();
  view('紬に話しかける',true,
   '<div class="say" style="font-size:16px"><small>紬</small>'+(c.ai&&c.key?'AIがつながっています。分からないことを、何でも聞いてください。':'質問してください。いまは、一般的な目安と過去の記録で答えます(AIはオフ)。')+'</div>'+
   '<div id="cl"></div><textarea id="cq" placeholder="質問や状況を入力(声でも入力できます)" style="min-height:80px"></textarea><div class="mic" id="mic"></div>'+
   '<div class="row"><button class="btn gray" id="cMic">🎤 声で</button><button class="btn" id="cSend">送る ▶</button></div>'+
   '<button class="btn line" id="cNew">新しい質問にする</button>');
  function paint(){
    document.getElementById('cl').innerHTML=S.chat.map(function(m){
      return '<div class="card" style="'+(m.role==='user'?'margin-left:30px;background:#33496e':'margin-right:30px')+';white-space:pre-wrap;font-size:17px;line-height:1.55">'+esc(m.text)+'</div>'}).join('');
    M.scrollTop=M.scrollHeight;
  }
  paint();
  on('cMic',function(){listen(function(t){var e=document.getElementById('cq');e.value=(e.value?e.value+' ':'')+t;document.getElementById('mic').textContent=''},function(m){document.getElementById('mic').textContent=m})});
  on('cNew',function(){S.chat=[];S.aiHist=[];S.prevQ='';chat()});
  on('cSend',function(){
    var q=document.getElementById('cq').value.trim();if(!q)return;
    document.getElementById('cq').value='';
    S.chat.push({role:'user',text:q});S.chat.push({role:'model',text:'…'});paint();var kind=classify(q);
    var idx=S.chat.length-1;
    var miss=false;
    function done(a){if(a.indexOf('⚠KB_MISS')===0){miss=true;a='その質問には、まだ答えを持っていません。分かる範囲で、目安を出します。\n\n'+a.slice(8)}
      S.chat[idx].text='【紬の見立て:'+kind+'】\n\n'+a;paint();speak(a.replace(/\n/g,'。').slice(0,300));
      var en={id:Date.now(),type:'chat',at:now(),text:q,answer:a,kind:kind};addLog(en);
      var fbx=document.createElement('div');fbx.className='row';fbx.innerHTML='<button class="btn ok" type="button">👍 役に立った</button><button class="btn warn" type="button">👎 違う</button>';
      document.getElementById('cl').appendChild(fbx);
      function setfb(v,btn){en.feedback=v;var l=log();for(var i=0;i<l.length;i++){if(l[i].id===en.id){l[i]=en;break}}save(KEY.log,l);btn.textContent='記録しました ✓'}
      fbx.children[0].onclick=function(){setfb(1,this)};fbx.children[1].onclick=function(){setfb(-1,this)};
      var tb=document.createElement('div');tb.className='card';
      tb.innerHTML='<div style="font-size:15px;margin-bottom:6px">'+(miss?'答えを知っていたら、紬に教えてください。次から同じ質問に答えます。':'もっと良い答えを知っていたら、教えてください。')+'</div><textarea style="min-height:60px" placeholder="正しい答え・自分ならこうする"></textarea><button class="btn gray" type="button">📝 紬に教える</button>';
      document.getElementById('cl').appendChild(tb);
      tb.querySelector('button').onclick=function(){var v=tb.querySelector('textarea').value.trim();if(!v)return;kbTeach(q,v);this.textContent='覚えました ✓';this.disabled=true};
      M.scrollTop=M.scrollHeight}
    var prevQ=S.prevQ||'';S.prevQ=q;
    var cc=cfg();
    if(cc.ai&&cc.key){
      done(localAnswer(q,prevQ).replace(/\n\n\(AIの会話はオフです.*$/,''));
      gateAI(q,cc,function(safe){
        var ai={role:'model',text:'…'};S.chat.push(ai);paint();
        var extra='';
        if(cc.useLog){var sm=similar(safe,null);if(sm.length)extra='\n\n【過去の記録(参考)】\n'+sm.map(function(x){return sanitize(x.text,true).text}).join('\n')}
        S.aiHist=S.aiHist||[];var hist=S.aiHist.slice(-8).concat([{role:'user',text:safe}]);
        callAI(hist,extra).then(function(a){S.aiHist.push({role:'user',text:safe},{role:'model',text:a});ai.text='🤖 AIの返事(送った内容:'+safe.slice(0,40)+(safe.length>40?'…':'')+')\n\n'+a;paint();speak(a.replace(/\n/g,'。').slice(0,300));
          addLog({id:Date.now()+1,type:'chat',at:now(),text:'[外部AIに送信] '+safe,answer:a,sent:true})})
        .catch(function(e){ai.text='AIにつながりませんでした('+e.message+')';paint()});
      },function(){S.chat.push({role:'model',text:'AIには送りませんでした。上の目安だけで進めます。'});paint()});
    }else done(localAnswer(q,prevQ));
  });
}

/* ---- 設定 ---- */
function settings(){
  stopAll();var c=cfg();
  view('設定',true,
   '<label class="sw"><input type="checkbox" id="cv"'+(c.voice?' checked':'')+'>紬の声を出す</label>'+
   '<label class="sw"><input type="checkbox" id="cl"'+(c.listen?' checked':'')+'>質問のあと、自動で声を聞き取る(ヘッドセット向け)</label>'+
   '<div class="say" style="font-size:16px"><small>点検項目(1行に1つ)</small>設備に合わせて書き換えられます。この内容はこのスマホの中だけに保存されます。</div>'+
   '<textarea id="it" style="min-height:150px">'+esc(items().join('\n'))+'</textarea>'+
   '<div class="say" style="font-size:16px;margin-top:14px"><small>AIに相談する(Gemini)・初期はオフ</small>オンにすると、メモの内容がGoogleのAIに送られます。</div>'+
   '<label class="sw"><input type="checkbox" id="ca"'+(c.ai?' checked':'')+'>AIに相談できるようにする</label>'+
   '<input id="ck" type="password" placeholder="Gemini APIキー(このスマホの中だけに保存)" value="'+esc(c.key)+'" style="width:100%;min-height:48px;border-radius:12px;border:2px solid #46556f;background:#141b28;color:#eef2f8;font-size:16px;padding:0 10px;margin:6px 0">'+
   '<input id="cm" placeholder="モデル名" value="'+esc(c.model)+'" style="width:100%;min-height:48px;border-radius:12px;border:2px solid #46556f;background:#141b28;color:#eef2f8;font-size:16px;padding:0 10px;margin:0 0 6px">'+
   '<div style="font-weight:700;margin-top:8px">伏せ字・言い換えの言葉(1行に1つ)<br><span style="font-size:14px;font-weight:400">例: 山田工業=当社 / P-101=増圧ポンプ / 社内用語(=のない行は伏せ字)</span></div><textarea id="cng" style="min-height:90px">'+esc(c.ng||'')+'</textarea>'+
   '<label class="sw"><input type="checkbox" id="cu"'+(c.useLog?' checked':'')+'>質問のとき、似た過去の記録も参考として送る(記録の一部がAIに送られます)</label>'+
   '<label class="sw"><input type="checkbox" id="cc">会社の機密(設備の型式・図面・数値など)は入れない。無料枠では、入力が改善に使われる場合があることを理解しました</label>'+
   '<button class="btn ok" id="sv">保存する</button><button class="btn line" id="rs">点検項目を初期にもどす</button>'+
   '<div class="note"><b>注意:</b>社内のルールを確認するまでは、AIの相談をオンにしないでください。オフのままでも、紬は一般的な目安で返事をします。</div>');
  on('sv',function(){
    var v=document.getElementById('it').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
    var ai=document.getElementById('ca').checked,ok=document.getElementById('cc').checked;
    if(ai&&!ok){alert('AIを使うには、注意事項のチェックが必要です');return}
    save(KEY.items,v.length?v:DEFAULT_ITEMS);
    save(KEY.cfg,{voice:document.getElementById('cv').checked,listen:document.getElementById('cl').checked,ai:ai,useLog:document.getElementById('cu').checked,key:document.getElementById('ck').value.trim(),model:document.getElementById('cm').value.trim()||'gemini-flash-latest',ng:document.getElementById('cng').value});
    home();
  });
  on('rs',function(){save(KEY.items,DEFAULT_ITEMS);settings()});
}

window.TSU_TEST={items:items,log:log,replyFor:replyFor,report:report,similar:similar,TYPES:TYPES};
home();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
