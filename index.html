<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3a55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>紬 保全パートナー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1d2636;color:#eef2f8;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;overscroll-behavior-y:none}
.app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{flex:none;padding:10px 14px;display:flex;align-items:center;gap:10px;background:#2b3a55}
header h1{margin:0;font-size:20px;flex:1}
header .ver{font-size:12px;color:#a9b6cc}
header button{min-height:40px;padding:0 12px;border-radius:12px;border:2px solid #8fa3c4;background:transparent;color:#eef2f8;font-size:15px;font-weight:800}
main{flex:1;min-height:0;overflow:auto;padding:14px}
.say{background:#2b3a55;border-radius:16px;padding:14px;font-size:20px;font-weight:800;line-height:1.5;margin-bottom:12px;border-left:6px solid #ffb86b}
.say small{display:block;font-size:13px;font-weight:700;color:#a9b6cc;margin-bottom:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:64px;margin:8px 0;border-radius:16px;border:0;font-size:21px;font-weight:900;color:#fff;background:#3b6fd4}
.btn.ok{background:#2f8f5b}.btn.warn{background:#d99a1f;color:#1d2636}.btn.ng{background:#c9453b}.btn.gray{background:#46556f}.btn.line{background:transparent;border:3px solid #8fa3c4;color:#eef2f8}
.row{display:flex;gap:8px}.row .btn{margin:6px 0}
.prog{font-size:15px;color:#a9b6cc;font-weight:800;margin-bottom:6px}
textarea{width:100%;min-height:110px;border-radius:12px;border:2px solid #46556f;background:#141b28;color:#eef2f8;font-size:18px;padding:10px;font-family:inherit}
.card{background:#2b3a55;border-radius:14px;padding:12px;margin:8px 0}
.card b{font-size:17px}.card .m{font-size:14px;color:#a9b6cc;margin-top:4px;line-height:1.5;white-space:pre-wrap}
.tag{display:inline-block;font-size:12px;font-weight:900;border-radius:8px;padding:1px 8px;margin-right:6px;background:#46556f}
.tag.ng{background:#c9453b}.tag.warn{background:#d99a1f;color:#1d2636}.tag.ok{background:#2f8f5b}
.mic{font-size:15px;color:#ffb86b;font-weight:800;min-height:22px;margin:4px 0}
label.sw{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;min-height:48px}
label.sw input{width:26px;height:26px}
.note{font-size:13px;color:#a9b6cc;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<div class="app">
 <header><h1 id="ttl">紬</h1><span class="ver">Ver 0.1</span><button id="back" type="button" style="display:none">← 戻る</button></header>
 <main id="main"></main>
</div>
<script>
(function(){
'use strict';
var KEY={items:'tsu_items',log:'tsu_log',cfg:'tsu_cfg',draft:'tsu_draft'};
var DEFAULT_ITEMS=['外観(漏れ・破損・ゆるみ)','音(いつもと違う音)','振動','熱・におい','計器の値','まわりの清掃・整理'];
var synth=window.speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var M=document.getElementById('main'),T=document.getElementById('ttl'),B=document.getElementById('back');
var S={token:0,rec:null,voice:null,inspect:null};

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cfg(){return Object.assign({voice:true,listen:false},load(KEY.cfg,{}))}
function items(){var a=load(KEY.items,null);return a&&a.length?a:DEFAULT_ITEMS}
function log(){return load(KEY.log,[])}
function addLog(e){var l=log();l.unshift(e);save(KEY.log,l.slice(0,500))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function now(){var d=new Date(),p=function(n){return('0'+n).slice(-2)};return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}

function stopAll(){S.token++;try{synth&&synth.cancel()}catch(e){}try{S.rec&&S.rec.abort()}catch(e){}S.rec=null}
function speak(t){
  return new Promise(function(res){
    if(!synth||!cfg().voice)return res();
    var u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.0;
    var vs=synth.getVoices()||[];var v=vs.filter(function(x){return /^ja/i.test(x.lang)})[0];if(v)u.voice=v;
    var d=false;function f(){if(!d){d=true;res()}}u.onend=f;u.onerror=f;setTimeout(f,15000);
    synth.cancel();synth.speak(u);
  });
}
function listen(onText,onState){
  if(!SR){onState&&onState('この端末では声の聞き取りが使えません。ボタンで答えてください');return}
  try{S.rec&&S.rec.abort()}catch(e){}
  var r=new SR();r.lang='ja-JP';r.interimResults=false;S.rec=r;var got=false;
  r.onresult=function(e){got=true;onText(e.results[0][0].transcript)};
  r.onerror=function(){onState&&onState('聞き取れませんでした')};
  r.onend=function(){if(!got)onState&&onState('聞き取れませんでした')};
  onState&&onState('🎤 聞いています…');
  try{r.start()}catch(e){}
}
function judge(t){
  t=t.replace(/\s/g,'');
  if(/異常|おかしい|だめ|ダメ|壊れ|漏れ|止ま/.test(t))return'ng';
  if(/気になる|ちょっと|少し|微妙|いつもと違/.test(t))return'warn';
  if(/正常|大丈夫|問題ない|問題なし|OK|オーケー|いつも通り|異常なし/.test(t))return'ok';
  if(/次|スキップ|飛ばし/.test(t))return'skip';
  return'';
}

function view(title,showBack,html){T.textContent=title;B.style.display=showBack?'':'none';M.innerHTML=html;M.scrollTop=0}
function on(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn}

/* ---- ホーム ---- */
function home(){
  stopAll();
  var l=log().filter(function(x){return x.type==='inspect'});
  var last=l[0]?('前回の点検:'+l[0].at+'(異常'+l[0].ng+'・気になる'+l[0].warn+')'):'まだ点検の記録はありません';
  view('紬',false,
   '<div class="say"><small>紬</small>おつかれさまです。今日もいっしょに見ていきましょう。<br><span style="font-size:15px;font-weight:700;color:#a9b6cc">'+esc(last)+'</span></div>'+
   '<button class="btn" id="bStart">▶ 稼働中点検をはじめる</button>'+
   '<button class="btn ng" id="bAbn">⚠ 異常を記録する</button>'+
   '<button class="btn gray" id="bMemo">💬 紬に相談・メモ</button>'+
   '<button class="btn gray" id="bLog">📖 見聞録を見る</button>'+
   '<button class="btn line" id="bSet">⚙ 設定・点検項目</button>'+
   '<div class="note">記録はこのスマホの中だけに保存されます。外部には送りません。</div>');
  on('bStart',startInspect);on('bAbn',function(){memo('異常を記録する','abnormal','どの設備で、どんな異常ですか?')});
  on('bMemo',function(){memo('紬に相談・メモ','consult','気になったこと、迷っていることを話してください。')});
  on('bLog',showLog);on('bSet',settings);
}
B.onclick=home;

/* ---- 点検 ---- */
function startInspect(){
  stopAll();
  S.inspect={at:now(),equip:'',results:[],i:0,learn:''};
  view('点検の前に',true,
   '<div class="say"><small>紬</small>今日の点検は、どの設備ですか?</div>'+
   '<textarea id="eq" placeholder="例:○○ライン 〇号機(声でも入力できます)" style="min-height:70px"></textarea>'+
   '<div class="mic" id="mic"></div>'+
   '<button class="btn gray" id="eqMic">🎤 声で入れる</button>'+
   '<button class="btn" id="eqGo">点検スタート ▶</button>');
  speak('今日の点検は、どの設備ですか?');
  on('eqMic',function(){listen(function(t){document.getElementById('eq').value=t;document.getElementById('mic').textContent=''},function(m){document.getElementById('mic').textContent=m})});
  on('eqGo',function(){S.inspect.equip=document.getElementById('eq').value.trim();S.inspect.i=0;ask()});
}
function ask(){
  var I=S.inspect,list=items();
  if(I.i>=list.length)return learn();
  var my=++S.token,it=list[I.i];
  view('点検 '+(I.i+1)+'/'+list.length,true,
   '<div class="prog">'+esc(I.equip||'点検中')+'</div>'+
   '<div class="say"><small>紬</small>'+esc(it)+'は、どうですか?</div>'+
   '<div class="row"><button class="btn ok" id="rOk">正常</button><button class="btn warn" id="rWarn">気になる</button></div>'+
   '<div class="row"><button class="btn ng" id="rNg">異常</button><button class="btn gray" id="rSkip">とばす</button></div>'+
   '<div class="mic" id="mic"></div>'+
   '<button class="btn line" id="rMic">🎤 声で答える(「正常」「気になる」「異常」)</button>');
  function go(r){stopAll();if(r==='skip'){I.i++;return ask()}
    if(r==='ok'){I.results.push({item:it,r:'ok',memo:''});I.i++;return ask()}
    detail(it,r)}
  on('rOk',function(){go('ok')});on('rWarn',function(){go('warn')});on('rNg',function(){go('ng')});on('rSkip',function(){go('skip')});
  function voiceAns(){listen(function(t){var r=judge(t);if(r)go(r);else{document.getElementById('mic').textContent='「'+t+'」…もう一度お願いします';setTimeout(voiceAns,600)}},function(m){var e=document.getElementById('mic');if(e)e.textContent=m})}
  on('rMic',voiceAns);
  speak(it+'は、どうですか?').then(function(){if(my===S.token&&cfg().listen)voiceAns()});
}
function detail(it,r){
  var I=S.inspect;
  view(r==='ng'?'異常':'気になる',true,
   '<div class="say"><small>紬</small>'+esc(it)+':'+(r==='ng'?'異常':'気になる')+'ですね。どんな様子か、教えてください。</div>'+
   '<textarea id="mm" placeholder="様子・場所・いつから(声でも入力できます)"></textarea><div class="mic" id="mic"></div>'+
   '<button class="btn gray" id="mMic">🎤 声でメモ</button><button class="btn" id="mGo">記録して次へ ▶</button>');
  speak('どんな様子か、教えてください。');
  on('mMic',function(){listen(function(t){var e=document.getElementById('mm');e.value=(e.value?e.value+' ':'')+t;document.getElementById('mic').textContent=''},function(m){document.getElementById('mic').textContent=m})});
  on('mGo',function(){stopAll();I.results.push({item:it,r:r,memo:document.getElementById('mm').value.trim()});I.i++;ask()});
}
function learn(){
  var I=S.inspect;
  view('今日の学び',true,
   '<div class="say"><small>紬</small>おつかれさまでした。今日、気づいたことや、自分でこう判断した、ということがあれば教えてください。(なければ空のままで大丈夫です)</div>'+
   '<textarea id="ln" placeholder="例:この音は負荷が上がったときに出る。前より少し高い。"></textarea><div class="mic" id="mic"></div>'+
   '<button class="btn gray" id="lMic">🎤 声でメモ</button><button class="btn ok" id="lGo">点検を終えて保存する</button>');
  speak('おつかれさまでした。今日、気づいたことや、自分でこう判断したことがあれば、教えてください。');
  on('lMic',function(){listen(function(t){var e=document.getElementById('ln');e.value=(e.value?e.value+' ':'')+t;document.getElementById('mic').textContent=''},function(m){document.getElementById('mic').textContent=m})});
  on('lGo',function(){
    stopAll();I.learn=document.getElementById('ln').value.trim();
    var ng=I.results.filter(function(x){return x.r==='ng'}).length,warn=I.results.filter(function(x){return x.r==='warn'}).length;
    addLog({type:'inspect',at:I.at,equip:I.equip,results:I.results,ng:ng,warn:warn,learn:I.learn});
    view('保存しました',false,'<div class="say"><small>紬</small>保存しました。異常 '+ng+' 件、気になる '+warn+' 件でした。'+(ng?'異常はすぐに上の人へ連絡してくださいね。':'おつかれさまでした。')+'</div><button class="btn" id="hm">ホームへ</button>');
    on('hm',home);speak('保存しました。異常は'+ng+'件、気になるは'+warn+'件でした。');
  });
}

/* ---- メモ(異常・相談) ---- */
function memo(title,type,prompt_){
  stopAll();
  view(title,true,'<div class="say"><small>紬</small>'+esc(prompt_)+'</div><textarea id="mm" placeholder="声でも入力できます"></textarea><div class="mic" id="mic"></div>'+
   '<button class="btn gray" id="mMic">🎤 声でメモ</button><button class="btn" id="mGo">記録する</button>');
  speak(prompt_);
  on('mMic',function(){listen(function(t){var e=document.getElementById('mm');e.value=(e.value?e.value+' ':'')+t;document.getElementById('mic').textContent=''},function(m){document.getElementById('mic').textContent=m})});
  on('mGo',function(){
    var t=document.getElementById('mm').value.trim();if(!t)return;
    addLog({type:type,at:now(),text:t});
    var reply=type==='abnormal'?'記録しました。安全を最優先に、必要なら上の人へすぐ連絡してください。':'記録しました。あなたの考え方も、ここに積み重ねていきますね。';
    view('記録しました',false,'<div class="say"><small>紬</small>'+reply+'</div><button class="btn" id="hm">ホームへ</button>');on('hm',home);speak(reply);
  });
}

/* ---- 見聞録 ---- */
function showLog(){
  stopAll();var l=log();
  var h=l.length?l.slice(0,60).map(function(x,i){
    if(x.type==='inspect')return '<div class="card"><span class="tag '+(x.ng?'ng':x.warn?'warn':'ok')+'">点検</span><b>'+esc(x.equip||'(設備未入力)')+'</b><div class="m">'+esc(x.at)+'\n異常 '+x.ng+' / 気になる '+x.warn+
      (x.results.filter(function(r){return r.r!=='ok'}).map(function(r){return '\n・'+r.item+'('+(r.r==='ng'?'異常':'気になる')+'):'+(r.memo||'')}).join(''))+(x.learn?'\n📝 学び:'+x.learn:'')+'</div></div>';
    return '<div class="card"><span class="tag '+(x.type==='abnormal'?'ng':'')+'">'+(x.type==='abnormal'?'異常':'相談')+'</span><b>'+esc(x.at)+'</b><div class="m">'+esc(x.text)+'</div></div>';
  }).join(''):'<div class="say"><small>紬</small>まだ記録がありません。</div>';
  view('見聞録',true,h+'<button class="btn gray" id="exp">⬇ 記録を書き出す(テキスト)</button><button class="btn line" id="cp">📋 コピーする</button>');
  function text(){return log().map(function(x){return x.type==='inspect'?('[点検] '+x.at+' '+x.equip+' 異常'+x.ng+' 気になる'+x.warn+x.results.filter(function(r){return r.r!=='ok'}).map(function(r){return ' / '+r.item+':'+r.memo}).join('')+(x.learn?' / 学び:'+x.learn:'')):('['+(x.type==='abnormal'?'異常':'相談')+'] '+x.at+' '+x.text)}).join('\n')}
  on('exp',function(){var b=new Blob([text()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tsumugi-kenmonroku.txt';a.click()});
  on('cp',function(){try{navigator.clipboard.writeText(text())}catch(e){}});
}

/* ---- 設定 ---- */
function settings(){
  stopAll();var c=cfg();
  view('設定',true,
   '<label class="sw"><input type="checkbox" id="cv"'+(c.voice?' checked':'')+'>紬の声を出す</label>'+
   '<label class="sw"><input type="checkbox" id="cl"'+(c.listen?' checked':'')+'>質問のあと、自動で声を聞き取る(ヘッドセット向け)</label>'+
   '<div class="say" style="font-size:16px"><small>点検項目(1行に1つ)</small>設備に合わせて書き換えられます。この内容はこのスマホの中だけに保存されます。</div>'+
   '<textarea id="it" style="min-height:180px">'+esc(items().join('\n'))+'</textarea>'+
   '<button class="btn ok" id="sv">保存する</button><button class="btn line" id="rs">初期の項目にもどす</button>'+
   '<div class="note"><b>注意:</b>会社の機密にあたる情報(設備の型式・図面・数値など)は、社内のルールを確認するまで、ここに入れないでください。</div>');
  on('sv',function(){var v=document.getElementById('it').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);save(KEY.items,v.length?v:DEFAULT_ITEMS);save(KEY.cfg,{voice:document.getElementById('cv').checked,listen:document.getElementById('cl').checked});home()});
  on('rs',function(){save(KEY.items,DEFAULT_ITEMS);settings()});
}

window.TSU_TEST={items:items,log:log};
home();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
